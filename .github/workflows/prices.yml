# 관심 종목 종가를 매일 받아 prices.json으로 저장하는 자동 작업
name: 관심 종목 종가 업데이트

on:
  schedule:
    - cron: "0 7 * * 1-5"     # 한국 주식: 평일 한국 시간 16:00
    - cron: "0 21 * * 1-5"    # 미국 주식(서머타임 기간): 한국 시간 다음 날 06:00
    - cron: "0 22 * * 1-5"    # 미국 주식(서머타임 아닐 때): 한국 시간 다음 날 07:00
  push:
    paths: ["watchlist.json"]  # 종목 목록을 바꾸면 바로 실행
  workflow_dispatch:           # Actions 탭에서 직접 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # 미국 시간 두 개 중 지금 서머타임 여부에 맞는 하나만 실행
      - name: 실행할 차례인지 확인
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          run = True
          if os.environ["EVENT"] == "schedule" and os.environ["CRON"] != "0 7 * * 1-5":
              summer = bool(datetime.now(ZoneInfo("America/New_York")).dst())
              run = (os.environ["CRON"] == "0 21 * * 1-5") == summer
          print("run=" + ("true" if run else "false"))
          PY
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - name: 종가 받아오기
        if: steps.gate.outputs.run == 'true'
        run: python3 fetch_prices.py
      - name: 바뀐 내용 저장
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "종가 업데이트" && git push)
