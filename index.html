<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 일정">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>나의 일정 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE: 차분하고 실용적인 개인 다이어리, 매일 여는 도구
   IDEA: 벽에 거는 한국식 달력 — 일요일은 빨강, 토요일은 파랑
   PICTURE: 달력 그리드 자체가 그림, 옆에는 시간이 크게 매달린 하루 목록
   COLOUR and TYPE: 흰 종이 + 먹색, 일요일 빨강을 강조색으로; Gothic A1 제목 + Noto Sans KR 본문
   LAYOUT: 상단 월 제목과 이동 버튼, 좌측 달력, 우측 선택한 날의 일정과 다가오는 일정 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121316);--paper:light-dark(#f4f5f7,#1b1d22);--ink:light-dark(#16181d,#eceef2);
--mute:light-dark(#646a75,#9aa1ad);--line:light-dark(#e3e5ea,#2b2e35);--red:light-dark(#d92d3a,#ff6b74);
--blue:light-dark(#2563d9,#6d9bff);--sel:light-dark(#16181d,#eceef2);--selInk:light-dark(#ffffff,#121316);
--c-work:light-dark(#2563d9,#6d9bff);--c-me:light-dark(#8a3fd1,#c08cff);--c-meet:light-dark(#e0730f,#ffa95a);--c-etc:light-dark(#5f6b7a,#a3adbb)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:calc(clamp(18px,3vw,40px) + env(safe-area-inset-top)) calc(max(4vw,14px) + env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) calc(max(4vw,14px) + env(safe-area-inset-left))}
.backup{display:flex;flex-wrap:wrap;gap:8px}
.pw{margin-bottom:10px}.pw span{font-weight:400;color:var(--mute);font-size:13px}.backup input{display:none}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 20px;margin-bottom:18px}
h1{font:800 clamp(32px,5vw,50px)/1.05 "Gothic A1",sans-serif;margin:0;letter-spacing:-.02em;text-wrap:balance}
h1 small{display:block;font:500 15px/1.4 "Noto Sans KR",sans-serif;color:var(--mute);margin-bottom:6px;letter-spacing:0}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500}
.btn:hover{background:var(--paper)}
.btn.icon{width:44px;padding:0;font-size:20px;line-height:1}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.dan{color:var(--red)}
.quick{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin:0 0 18px}
.quick input{min-height:54px;font-size:17px;border:2px solid var(--ink);border-radius:14px;padding:10px 16px}
.quick .btn{min-height:54px;border-radius:14px;padding:0 22px;font-size:16px}
.qPrev{grid-column:1/-1;margin:0;font-size:14px;color:var(--mute);min-height:1.55em}
.qPrev b{color:var(--ink)}.qPrev .bad{color:var(--red)}
.mon{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);user-select:none}
.arw{width:44px;height:44px;border:0;border-radius:12px;background:none;font-size:28px;line-height:1;color:var(--ink)}@media(hover:hover){.arw:hover{background:var(--paper)}}
.mon b{font:800 24px/1.1 "Gothic A1",sans-serif;text-align:center;cursor:pointer;padding:8px 0}
.cal{touch-action:pan-y}
.wx{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 16px;border:1px solid var(--line);border-radius:16px;max-width:100%}
.wx svg{width:46px;height:46px;flex:none}
.wx .tp{font:800 34px/1 "Gothic A1",sans-serif;white-space:nowrap}
.wx .ds{display:grid;gap:2px;font-size:13px;color:var(--mute);line-height:1.35}
.wx .ds b{color:var(--ink);font-size:15px}
.wx .btn{white-space:nowrap}
.status{font-size:14px;color:var(--mute);margin:-6px 0 14px;min-height:0}
.status:empty{display:none}
.main{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:22px;align-items:start}
.cal{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg)}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow div{padding:10px 8px;font-size:13px;font-weight:700;color:var(--mute);background:var(--paper);border-bottom:1px solid var(--line)}
.dow div:first-child,.sun .num{color:var(--red)}
.dow div:last-child,.sat .num{color:var(--blue)}
.cell{min-height:108px;padding:6px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:left;display:flex;flex-direction:column;gap:3px}
.cell:nth-child(7n){border-right:0}
.cell.out{background:var(--paper)}.cell.out .num{opacity:.45}
.num{font:700 14px/1 "Gothic A1",sans-serif;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.today .num{outline:2px solid var(--red);outline-offset:-2px}
.cell.on .num{background:var(--sel);color:var(--selInk)!important;outline:0}
.cell:hover{background:var(--paper)}
.hol .num{color:var(--red)}
.hf{display:flex;align-items:center;gap:3px;min-width:0;padding-left:2px}
.flag{width:18px;height:12px;flex:none;border-radius:2px;box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
.hn{font-size:11px;font-weight:500;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:2px}
.holl{display:flex;align-items:center;gap:8px;margin:6px 0;font-weight:700;color:var(--red)}.holl .flag{width:24px;height:16px}
.chip{font-size:12px;line-height:1.35;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;background:var(--c)}
@media(max-width:600px){.ct{display:none}}
.more{font-size:12px;font-weight:700;color:var(--mute);padding-left:4px}.more.m{display:none}
.dots{display:none;gap:3px;flex-wrap:wrap;padding-left:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
aside{display:grid;gap:18px}
.panel{border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h2{font:700 22px/1.2 "Gothic A1",sans-serif;margin:0 0 4px}
.panel .sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ev{display:grid;grid-template-columns:6em minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.time{font:700 17px/1.3 "Gothic A1",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.time span{display:block;font:500 13px/1.3 "Noto Sans KR",sans-serif;color:var(--mute)}
.ev b{display:block;font-weight:700;overflow-wrap:anywhere}
.ev p{margin:2px 0 0;font-size:14px;color:var(--mute);overflow-wrap:anywhere;white-space:pre-wrap}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--c);margin-top:2px}
.ev .edit{min-height:44px;margin-right:-8px;padding:0 12px;border:0;background:none;color:var(--mute);border-radius:8px}
.ev .edit:hover{background:var(--paper);color:var(--ink)}
.empty{color:var(--mute);font-size:15px;padding:10px 0}
form{display:grid;gap:12px}
label{display:grid;gap:5px;font-size:14px;font-weight:500}
input,select,textarea{font-size:16px;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);width:100%}
textarea{min-height:76px;resize:vertical}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats label{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;cursor:pointer}
.cats input{width:auto;min-height:0;accent-color:var(--c)}
.cats label:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.acts .btn.dan{margin-right:auto}
.err{color:var(--red);font-size:14px;margin:0}
.up{gap:0}
.up .day{padding:14px 0;border-top:2px solid var(--line)}.up .day:first-child{border-top:0;padding-top:4px}
.up .dh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.up .dh b{font:700 16px/1.3 "Gothic A1",sans-serif}
.up .dh span{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--paper);color:var(--mute)}
.up .now .dh span{background:var(--red);color:#fff}
.up .row{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:10px;padding:5px 0 5px 2px}
.up .tm{font-size:14px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.up .row b{font-weight:500;overflow-wrap:anywhere}
.upmore{padding-top:10px;border-top:2px solid var(--line)}.upmore .btn{width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:8px 8px 8px 18px;border-radius:12px;display:flex;gap:10px;align-items:center;transition:transform .25s;width:max-content;max-width:min(440px,calc(100vw - 28px))}
.toast.show{transform:translate(-50%,0)}
.toast span{min-width:0}.toast button{flex:none;white-space:nowrap;min-height:40px;border:0;border-radius:8px;padding:0 14px;background:var(--bg);color:var(--ink);font-weight:700}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){
header{flex-wrap:nowrap;align-items:flex-end;gap:10px}
h1{font-size:clamp(24px,7.4vw,32px)}
.wx{min-height:0;padding:0 0 2px;border:0;gap:6px;flex:none;align-items:center}
.wx svg{width:30px;height:30px}
.wx .tp{font-size:22px}
.wx .ds{font-size:12px;gap:0}.wx .ds b{font-size:12px;font-weight:500;color:var(--mute)}
.wx .ds>span,.wx .pl,.wx .ask{display:none}
.wx .btn{min-height:36px;padding:0 10px;font-size:13px}
.mon b{font-size:20px}}
@media(max-width:600px){.cell{min-height:76px;padding:3px 2px;align-items:stretch;gap:2px}.num{font-size:13px;width:24px;height:24px;margin:0 auto}.chip{font-size:10.5px;line-height:1.3;padding:2px 3px;border-radius:4px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}.chip.x{display:none}.more.d{display:none}.more.m{display:block}.more.m{font-size:11px;padding:0;text-align:center;color:var(--ink)}.hf{justify-content:center;padding:0}.hn{display:none}.flag{width:15px;height:10px}.dow div{text-align:center;padding:8px 2px}.quick{grid-template-columns:minmax(0,1fr) auto}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="fKR" viewBox="0 0 30 20"><rect width="30" height="20" fill="#fff"/><path d="M10 10a5 5 0 0 1 10 0z" fill="#cd2e3a"/><path d="M10 10a5 5 0 0 0 10 0z" fill="#0047a0"/><circle cx="12.5" cy="10" r="2.5" fill="#cd2e3a"/><circle cx="17.5" cy="10" r="2.5" fill="#0047a0"/><g transform="translate(6 4.5) rotate(-56)"><rect x="-2.6" y="-1.90" width="5.2" height="0.9" fill="#000"/><rect x="-2.6" y="-0.40" width="5.2" height="0.9" fill="#000"/><rect x="-2.6" y="1.10" width="5.2" height="0.9" fill="#000"/></g><g transform="translate(24 4.5) rotate(56)"><rect x="-2.6" y="-1.90" width="5.2" height="0.9" fill="#000"/><rect x="-2.6" y="-0.40" width="5.2" height="0.9" fill="#000"/><rect x="-2.6" y="1.10" width="5.2" height="0.9" fill="#000"/></g><g transform="translate(6 15.5) rotate(56)"><rect x="-2.6" y="-1.90" width="5.2" height="0.9" fill="#000"/><rect x="-2.6" y="-0.40" width="5.2" height="0.9" fill="#000"/><rect x="-2.6" y="1.10" width="5.2" height="0.9" fill="#000"/></g><g transform="translate(24 15.5) rotate(-56)"><rect x="-2.6" y="-1.90" width="5.2" height="0.9" fill="#000"/><rect x="-2.6" y="-0.40" width="5.2" height="0.9" fill="#000"/><rect x="-2.6" y="1.10" width="5.2" height="0.9" fill="#000"/></g></symbol>

</defs></svg>
<div class="wrap">
  <header>
    <h1 id="title"><small id="tYear"></small><span id="tDate"></span></h1>
    <div class="wx" id="wx" aria-live="polite"></div>
  </header>
  <form class="quick" id="quick" autocomplete="off">
    <input id="qIn" placeholder="예) ○○일 △△△과 점심" enterkeyhint="done" aria-label="일정을 한 줄로 입력">
    <button class="btn pri">추가</button>
    <p class="qPrev" id="qPrev" aria-live="polite">월을 빼면 이번 달로 들어가요.</p>

  <div class="main">
    <section class="cal" aria-label="달력">
      <div class="mon"><button class="arw" id="mPrev" aria-label="이전 달">‹</button><b id="ym" role="button" tabindex="0" title="이번 달로"> </b><button class="arw" id="mNext" aria-label="다음 달">›</button></div>
      <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>

      <section class="panel" id="dayPanel"></section>
      <section class="panel">
        <h2>다가오는 7일</h2>

        <h2>백업</h2>
        <p class="sub">일정은 이 휴대폰에만 저장돼요. 가끔 백업 파일을 받아 두면 폰을 바꿔도 옮길 수 있어요. 비밀번호를 정하면 파일이 암호화돼서, 비밀번호 없이는 아무도 열 수 없어요.</p>
        <label class="pw">백업 비밀번호 <span>(선택 · 받을 때와 불러올 때 같은 비밀번호)</span><input type="password" id="bkPw" autocomplete="new-password" placeholder="비워 두면 암호 없이 저장"></label>

<script>
{
const CATS={work:{n:'업무',v:'--c-work'},me:{n:'개인',v:'--c-me'},meet:{n:'약속',v:'--c-meet'},etc:{n:'기타',v:'--c-etc'}};
const DOW=['일','월','화','수','목','금','토'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const todayKey=()=>key(new Date());
const catOf=c=>CATS[c]?c:'etc';
const fmtT=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return(h<12?'오전 ':'오후 ')+((h%12)||12)+(m?':'+pad(m):'시')};
const okDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
const okTime=s=>!s||/^\d{2}:\d{2}$/.test(s);

let events=[],undoFn=null,toastTimer=0;
let view=new Date();view.setDate(1);
let sel=todayKey();
let editing=null; // null: 목록, {}: 새 일정, {id...}: 수정

function clean(raw,id){
  const e={id,title:String(raw.title||'').slice(0,120),date:okDate(raw.date)?raw.date:'',start:okTime(raw.start)?raw.start||'':'',end:okTime(raw.end)?raw.end||'':'',cat:catOf(raw.cat),memo:String(raw.memo||'').slice(0,1000),rep:['d','w','m','y'].includes(raw.rep)?raw.rep:''};
  return e.date&&e.title?e:null;
}
const sortEv=(a,b)=>(a.date+(a.start||'99')).localeCompare(b.date+(b.start||'99'));
// 반복 일정: d=매일, w=매주(시작일의 요일), m=매월(시작일의 날짜), y=매년(시작일의 월·일)
function occurs(e,k){
  if(e.date===k)return true;
  if(!e.rep||k<e.date)return false;
  const a=parse(e.date),d=parse(k);
  if(e.rep==='d')return true;
  if(e.rep==='w')return a.getDay()===d.getDay();
  const lastDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const dayOk=a.getDate()===d.getDate()||(a.getDate()>lastDay&&d.getDate()===lastDay);   // 31일 반복은 짧은 달엔 마지막 날
  if(e.rep==='m')return dayOk;
  if(e.rep==='y')return a.getMonth()===d.getMonth()&&dayOk;
  return false;
}
const REP_TXT=e=>{const a=parse(e.date);return e.rep==='d'?'매일':e.rep==='w'?'매주 '+DOW[a.getDay()]+'요일':e.rep==='m'?'매월 '+a.getDate()+'일':e.rep==='y'?'매년 '+(a.getMonth()+1)+'월 '+a.getDate()+'일':''};
const onDay=k=>events.filter(e=>occurs(e,k)).map(e=>e.date===k?e:{...e,date:k,anchor:e.date}).sort(sortEv);
const setStatus=t=>{$('status').textContent=t};

// ---------- 휴일 ----------
// 한국: 2026·2027년은 우주항공청 월력요항으로 확인한 목록, 그 밖의 해는 Nager.Date에서 자동으로 받아오기
const KR_HOL={
 '2026-01-01':'신정','2026-02-16':'설날 연휴','2026-02-17':'설날','2026-02-18':'설날 연휴','2026-03-01':'삼일절','2026-03-02':'대체공휴일',

// 미국 연방 공휴일: 규칙으로 계산 (토요일이면 금요일, 일요일이면 월요일에 대체)
function usHol(y){
  const nth=(m,wd,n)=>{const d=new Date(y,m,1);d.setDate(1+((wd-d.getDay()+7)%7)+7*(n-1));return d};
  const last=(m,wd)=>{const d=new Date(y,m+1,0);d.setDate(d.getDate()-((d.getDay()-wd+7)%7));return d};
  const out={};const put=(d,n)=>{(out[key(d)]=out[key(d)]||[]).push(n)};
  const fixed=(m,day,n)=>{const d=new Date(y,m,day);put(d,n);const w=d.getDay();if(w===6)put(new Date(y,m,day-1),n+' (대체)');if(w===0)put(new Date(y,m,day+1),n+' (대체)')};
  fixed(0,1,'새해 첫날');put(nth(0,1,3),'마틴 루서 킹 데이');put(nth(1,1,3),'대통령의 날');put(last(4,1),'메모리얼 데이');
  fixed(5,19,'준틴스');fixed(6,4,'독립기념일');put(nth(8,1,1),'노동절');put(nth(9,1,2),'콜럼버스 데이');
  fixed(10,11,'재향군인의 날');put(nth(10,4,4),'추수감사절');fixed(11,25,'크리스마스');
  return out;
}
const KR_FIXED_YEARS=[2026,2027];
const KR_REMOTE={},KR_LOADING={};
function krRemote(y){
  if(KR_FIXED_YEARS.includes(y)||KR_REMOTE[y]||KR_LOADING[y])return;
  let c=null;try{c=JSON.parse(localStorage.getItem('hol-kr-'+y)||'null')}catch(e){}
  if(c&&c.data){KR_REMOTE[y]=c.data;if(Date.now()-c.at<30*864e5)return}   // 30일 안에 받은 건 그대로 사용
  KR_LOADING[y]=true;
  fetch(`https://date.nager.at/api/v3/PublicHolidays/${y}/KR`).then(r=>r.ok?r.json():Promise.reject()).then(list=>{
    const data={};
    for(const x of Array.isArray(list)?list:[]){if(okDate(x.date)&&x.date.startsWith(y+'-'))data[x.date]=String(x.localName||x.name||'공휴일').slice(0,30)}
    if(!Object.keys(data).length)return;
    KR_REMOTE[y]=data;try{localStorage.setItem('hol-kr-'+y,JSON.stringify({at:Date.now(),data}))}catch(e){}
    if(!editing)render();else renderCal();
  }).catch(()=>{}).finally(()=>{KR_LOADING[y]=false});
}
const HOL_CACHE={};
function holOn(k){
  const y=+k.slice(0,4);
  if(!HOL_CACHE[y]){const a=usHol(y),b=usHol(y+1);for(const[kk,v]of Object.entries(b))if(kk.startsWith(y+'-'))a[kk]=(a[kk]||[]).concat(v);HOL_CACHE[y]=a}
  const kr=KR_HOL[k]||(KR_REMOTE[y]&&KR_REMOTE[y][k]);
  const r=[];if(kr)r.push({c:'KR',n:kr});for(const n of HOL_CACHE[y][k]||[])r.push({c:'US',n});return r;
}

  krRemote(start.getFullYear());krRemote(endD.getFullYear());

// ---------- 백업 (비밀번호가 있으면 AES-GCM으로 암호화) ----------
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pwKey(pw,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(text,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await pwKey(pw,salt),new TextEncoder().encode(text));
  return JSON.stringify({app:'내일정',v:1,enc:'AES-GCM',salt:b64(salt),iv:b64(iv),data:b64(ct)});
}
async function unseal(o,pw){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},await pwKey(pw,unb64(o.salt)),unb64(o.data));
  return new TextDecoder().decode(pt);
}

// 한 줄 일정 해석기: "11월 25일에 심우용 선임과 점심 12시 반" → {date, start, end, title, cat}
function parseQuick(text, now){
  now = now || new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const k2 = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  let s = ' ' + String(text || '').trim() + ' ';
  const cut = re => { const r = s.match(re); if (r) s = s.slice(0, r.index) + ' ' + s.slice(r.index + r[0].length); return r; };
  const P = '\\s*(?:에는|에서|에|엔|날|마다)?';
  let y = today.getFullYear(), yearGiven = false, m = null, d = null, date = null, r, err = '';

  // 연도
  if ((r = cut(/(\d{4})\s*년\s*/))) { y = +r[1]; yearGiven = true; }
  else if ((r = cut(/(내년|올해)\s*/))) { if (r[1] === '내년') y++; yearGiven = true; }

  // 반복 ("매일", "매주 월요일", "매월 25일", "매년 3월 2일")
  let rep = '';
  if ((r = cut(/매\s*일(?!\s*요일)\s*/))) rep = 'd';
  else if ((r = cut(/매\s*주\s*/))) rep = 'w';
  else if ((r = cut(/매\s*(?:월|달)(?!\s*요일)\s*/))) rep = 'm';
  else if ((r = cut(/매\s*년\s*/))) rep = 'y';

  // 날짜
  if ((r = cut(new RegExp('(\\d{1,2})\\s*월\\s*(\\d{1,2})\\s*일' + P)))) { m = +r[1]; d = +r[2]; }
  else if ((r = cut(new RegExp('(?<![\\d:])(\\d{1,2})\\s*[/.]\\s*(\\d{1,2})(?![\\d:])' + P)))) { m = +r[1]; d = +r[2]; }
  else if ((r = cut(new RegExp('(?<!\\d)(\\d{1,2})\\s*일(?!\\s*(?:간|동안))' + P)))) { m = today.getMonth() + 1; d = +r[1]; }
  else if ((r = cut(new RegExp('(오늘|내일|모레|글피)' + P)))) { date = addDays(today, {오늘:0, 내일:1, 모레:2, 글피:3}[r[1]]); }
  else if ((r = cut(new RegExp('(?:(이번|다음|다다음)\\s*주\\s*)?([월화수목금토일])요일' + P)))) {
    const idx = '월화수목금토일'.indexOf(r[2]);                  // 월=0 … 일=6
    const monday = addDays(today, -((today.getDay() + 6) % 7));
    if (r[1]) date = addDays(monday, idx + {이번:0, 다음:7, 다다음:14}[r[1]]);
    else { date = addDays(monday, idx); if (date < today) date = addDays(date, 7); }  // 가장 가까운 그 요일
  }
  if (m !== null) {
    if (!yearGiven && m < today.getMonth() + 1) y++;   // 이미 지난 달이면 내년
    date = new Date(y, m - 1, d);
    if (m < 1 || m > 12 || d < 1 || date.getMonth() !== m - 1) { err = m + '월 ' + d + '일은 없는 날짜예요.'; date = null; }
  } else if (date && yearGiven) date.setFullYear(y);
  // 반복 일정의 첫 날짜: 정하지 않았으면 오늘부터, 이미 지났으면 다음 차례로
  if (rep && !err) {
    if (!date) date = new Date(today);
    if (rep === 'm' && date < today) date = new Date(date.getFullYear(), date.getMonth() + 1, date.getDate());
    if (rep === 'y' && date < today) date = new Date(date.getFullYear() + 1, date.getMonth(), date.getDate());
  }

  // 시간 (최대 2개: 시작, 종료)
  const times = [];
  const TIME = /(오전|오후|아침|점심|저녁|밤|낮|새벽)?\s*(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분|(반))?|(?<![\d.\/])(\d{1,2}):(\d{2})(?!\d)/;
  for (let i = 0; i < 2; i++) {
    const t = s.match(TIME); if (!t) break;
    let h, min, ampm = t[1] || '';
    if (t[5] !== undefined) { h = +t[5]; min = +t[6]; ampm = 'clock'; }
    else { h = +t[2]; min = t[3] ? +t[3] : t[4] ? 30 : 0; }
    if (h > 24 || min > 59) break;
    // 뒤에 붙은 "부터/까지/에/~" 함께 지우기
    const tail = s.slice(t.index + t[0].length).match(/^\s*(?:부터|까지|에|~|-|–)?/)[0];
    const rest = s.slice(0, t.index) + s.slice(t.index + t[0].length);
    const keep = /점심|저녁/.test(t[1] || '') && !rest.includes(t[1]) ? t[1] : '';   // 제목에 이미 있으면 중복으로 넣지 않기   // "점심", "저녁"은 제목에 남기기
    s = s.slice(0, t.index) + ' ' + keep + ' ' + s.slice(t.index + t[0].length + tail.length);
    times.push({h, min, ampm});
  }
  const to24 = (t, prev) => {
    let h = t.h;
    if (t.ampm === 'clock') return h;
    if (/오후|저녁|밤/.test(t.ampm) && h < 12) h += 12;
    else if (/점심|낮/.test(t.ampm) && h < 6) h += 12;
    else if (/오전|아침|새벽/.test(t.ampm)) { if (h === 12) h = 0; }
    else if (prev != null) { if (h < 12 && h + 12 > prev && h <= prev) h += 12; }   // "3시~5시"
    else if (h >= 1 && h <= 7) h += 12;                                              // "3시" → 오후 3시
    return h % 24;
  };
  const fmt = (h, mi) => String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
  let start = '', end = '';
  if (times[0]) { const h = to24(times[0]); start = fmt(h, times[0].min);
    if (times[1]) { const h2 = to24(times[1], h); end = fmt(h2, times[1].min); if (end <= start) end = ''; } }

  // 시간을 안 적었을 때 단어로 기본 시간 정하기 (원하는 단어를 여기에 추가하면 돼요)
  const DEFAULT_TIMES = [[/점약/, '11:30']];
  if (!start) { const hit = DEFAULT_TIMES.find(([re]) => re.test(s)); if (hit) start = hit[1]; }

  // 제목 정리
  let title = s.replace(/\s+/g, ' ').trim().replace(/^(?:에는|에서|에|엔|,|·|-|~)\s*/, '').replace(/\s*(?:,|·|-|~)$/, '').trim();

  // 분류 추측
  const cat = /회의|미팅|보고|업무|출장|발표|마감|면접|세미나|교육/.test(title) ? 'work'
    : /점심|저녁|약속|모임|만나|만남|술|식사|커피|회식|생일|결혼/.test(title) ? 'meet'
    : /병원|치과|운동|헬스|요가|필라테스|미용|은행|공부|독서|생신|기념일/.test(title) ? 'me' : 'etc';

  return {date: date ? k2(date) : '', dateFound: !!date || !!err, start, end, title, cat, err, rep};
}

const qMsg=(html)=>{$('qPrev').innerHTML=html};
const qDesc=q=>{const d=parse(q.date);return (q.rep?`<b>↻ ${esc(REP_TXT(q))}</b> (${d.getMonth()+1}월 ${d.getDate()}일부터)`:`<b>${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})</b>`)+`${q.start?' · <b>'+esc(fmtT(q.start))+'</b>':''} · ${esc(q.title)}`};
function quickParse(){
  const q=parseQuick($('qIn').value);
  if(!q.date&&!q.err)q.date=sel;   // 날짜가 없으면 지금 고른 날짜로
  return q;
}
$('qIn').addEventListener('input',()=>{
  if(!$('qIn').value.trim()){qMsg('월을 빼면 이번 달로 들어가요.');return}
  const q=quickParse();
  if(q.err)return qMsg(`<span class="bad">${esc(q.err)}</span>`);
  if(!q.title)return qMsg('일정 내용도 적어 주세요.');
  qMsg('→ '+qDesc(q)+(q.dateFound?'':' <span class="bad">(날짜를 못 찾아서 선택한 날로 넣어요)</span>'));
});
$('quick').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const q=quickParse();
  if(q.err||!q.title){$('qIn').dispatchEvent(new Event('input'));return}
  const id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const e=clean({title:q.title,date:q.date,start:q.start,end:'',cat:'etc',memo:'',rep:q.rep},id);
  if(e&&await save(e)){
    sel=e.date;goMonth(sel);editing=null;render();
    $('qIn').value='';$('qIn').dispatchEvent(new Event('input'));
    toast(qDescText(e)+' 추가했어요.',async()=>{if(await remove(e.id))render()});
  }
});
const qDescText=e=>{const d=parse(e.date);return e.rep?`${REP_TXT(e)} “${e.title}”`:`${d.getMonth()+1}월 ${d.getDate()}일에 “${e.title}”`};
// ---------- 날씨 (Open-Meteo, 위치 이름은 BigDataCloud) ----------
const WX=c=>c===0||c===1?['맑음','sun']:c===2?['구름 조금','part']:c===3?['흐림','cloud']:c===45||c===48?['안개','fog']
  :c>=51&&c<=57?['이슬비','rain']:c>=61&&c<=67?['비','rain']:c>=71&&c<=77?['눈','snow']:c>=80&&c<=82?['소나기','rain']:c===85||c===86?['눈','snow']:c>=95?['뇌우','storm']:['날씨','cloud'];
const ICON={
  sun:'<circle cx="24" cy="24" r="9" fill="#f5a623"/><g stroke="#f5a623" stroke-width="3" stroke-linecap="round"><path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M9.9 38.1l4.2-4.2M33.9 14.1l4.2-4.2"/></g>',
  part:'<circle cx="18" cy="18" r="8" fill="#f5a623"/><path d="M15 38h20a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0 1 13z" fill="#aab2bf"/>',
  cloud:'<path d="M13 37h22a9 9 0 0 0 0-18 12 12 0 0 0-23 3 7.5 7.5 0 0 0 1 15z" fill="#8f98a6"/>',
  fog:'<path d="M13 28h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z" fill="#aab2bf"/><g stroke="#8f98a6" stroke-width="3" stroke-linecap="round"><path d="M8 34h32M12 41h24"/></g>',
  rain:'<path d="M13 29h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z" fill="#8f98a6"/><g stroke="#2563d9" stroke-width="3" stroke-linecap="round"><path d="M16 34l-3 7M25 34l-3 7M34 34l-3 7"/></g>',
  snow:'<path d="M13 29h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z" fill="#aab2bf"/><g fill="#6d9bff"><circle cx="15" cy="37" r="2.6"/><circle cx="24" cy="41" r="2.6"/><circle cx="33" cy="37" r="2.6"/></g>',
  storm:'<path d="M13 28h22a8 8 0 0 0 0-16 11 11 0 0 0-21 3 6.5 6.5 0 0 0-1 13z" fill="#6f7886"/><path d="M26 30l-7 9h6l-3 8 9-11h-6l3-6z" fill="#f5a623"/>'};
const wxBox=$('wx');
const wxAsk=msg=>{wxBox.onclick=null;wxBox.style.cursor='';wxBox.innerHTML=`<span class="ds ask">${esc(msg)}</span><button class="btn" id="wxBtn"><span class="pl">현재 위치 </span>날씨 보기</button>`;$('wxBtn').onclick=()=>wxLocate()};
function wxShow(w){
  const [name,ic]=WX(w.code);
  wxBox.innerHTML=`<svg viewBox="0 0 48 48" aria-hidden="true">${ICON[ic]}</svg><span class="tp">${Math.round(w.temp)}°</span><span class="ds"><b><span class="pl">${esc(w.place||'현재 위치')} · </span>${name}</b><span>최고 ${Math.round(w.max)}° / 최저 ${Math.round(w.min)}°${w.pop!=null?' · 강수 '+Math.round(w.pop)+'%':''}${w.acc>1000?' · 위치 오차 약 '+Math.round(w.acc/1000)+'km':''}</span><span>눌러서 새로고침</span></span>`;
  wxBox.onclick=()=>wxLocate();wxBox.style.cursor='pointer';
}
async function wxFetch(lat,lon,acc){
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),8000);
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(3)}&longitude=${lon.toFixed(3)}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`;
    const j=await (await fetch(u,{signal:ctl.signal})).json();
    let place='';
    try{const g=await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`,{signal:ctl.signal})).json();const adm=((g.localityInfo&&g.localityInfo.administrative)||[]).map(a=>String(a.name||'')).filter(Boolean);
      const gu=adm.filter(n=>/(구|군)$/.test(n)).pop()||adm.filter(n=>/시$/.test(n)&&!/특별시|광역시/.test(n)).pop()||String(g.city||'');
      const dong=String(g.locality||'');
      place=[gu,dong&&dong!==gu?dong:''].filter(Boolean).join(' ').slice(0,30)||String(g.principalSubdivision||'').slice(0,30)}catch(e){}
    const w={temp:+j.current.temperature_2m,code:+j.current.weather_code,max:+j.daily.temperature_2m_max[0],min:+j.daily.temperature_2m_min[0],pop:j.daily.precipitation_probability_max?.[0]??null,place,acc:isFinite(acc)?acc:null,at:Date.now(),lat,lon};
    if(!isFinite(w.temp))throw 0;
    try{localStorage.setItem('wx-cache',JSON.stringify(w))}catch(e){}
    wxShow(w);
  }catch(e){wxAsk('날씨를 가져오지 못했어요.')}finally{clearTimeout(tm)}
}
function wxLocate(){
  if(!navigator.geolocation)return wxAsk('이 기기에서는 위치를 쓸 수 없어요.');
  wxBox.onclick=null;wxBox.innerHTML='<span class="ds">현재 위치를 확인하는 중…</span>';
  navigator.geolocation.getCurrentPosition(pos=>{try{localStorage.setItem('wx-ok','1')}catch(e){}wxFetch(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy)},
    err=>{try{localStorage.removeItem('wx-ok')}catch(e){}wxAsk(err.code===1?'위치 권한을 허용하면 날씨가 보여요.':'위치를 찾지 못했어요.')},
    {enableHighAccuracy:true,timeout:15000,maximumAge:5*60000});
}
(function wxInit(){
  let c=null,ok=false;try{c=JSON.parse(localStorage.getItem('wx-cache')||'null');ok=localStorage.getItem('wx-ok')==='1'}catch(e){}
  if(c&&Date.now()-c.at<30*60000)return wxShow(c);   // 30분 안에 받은 날씨는 그대로
  if(c)wxShow(c);
  if(ok)wxLocate();else if(!c)wxAsk('오늘 날씨');
})();
load();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
}
</script>
